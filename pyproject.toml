[project]
name = "native-region-tile-planner-merge"
version = "0.2.0"
description = "Unified RegionEdit toolkit for region selection, mask editing, cropping, tiling, color and detail harmonization, and strict compositing in ComfyUI. Includes example workflows for smart removal and object replacement."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "scipy>=1.12,<2",
    "argostranslate>=1.9.6,<2",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/Liu-Bot24/ComfyUI-Region-Edit-Toolkit"
Documentation = "https://github.com/Liu-Bot24/ComfyUI-Region-Edit-Toolkit#readme"
"Bug Tracker" = "https://github.com/Liu-Bot24/ComfyUI-Region-Edit-Toolkit/issues"

[tool.comfy]
PublisherId = "lq36821"
DisplayName = "Region Edit Toolkit"

[tool.pytest.ini_options]
testpaths = ["tests"]
